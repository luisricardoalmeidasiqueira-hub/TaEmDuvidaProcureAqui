<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075b3a">
<title>SOLAR — Acompanhamento de Leituras</title>
<style>
:root{
  --green:#075b3a; --green2:#0b7a4b; --light:#eaf7f0; --bg:#f4f7f6;
  --text:#17332a; --muted:#6d7b76; --border:#dce6e1; --white:#fff;
  --shadow:0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--green),#0a8150);color:white;padding:18px 16px 22px;position:sticky;top:0;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.headerline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}.sun{font-size:30px}.brand{font-size:25px;font-weight:800;letter-spacing:.5px}
.subtitle{font-size:13px;opacity:.9;margin-top:2px}
.count{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:8px 10px;border-radius:12px;text-align:center;font-size:12px}
.count b{display:block;font-size:19px}
main{max-width:1050px;margin:auto;padding:14px}
.card{background:white;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:12px;font-weight:700;margin-bottom:5px;display:block}
input,select{width:100%;height:46px;border:1px solid #cfdcd6;border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(11,122,75,.1)}
.req{color:#d92d20}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
button{border:0;border-radius:12px;min-height:44px;padding:0 15px;font-weight:700;font-size:14px;cursor:pointer}
.primary{background:var(--green2);color:white}.secondary{background:#edf3f0;color:var(--green)}
.blue{background:#2475dc;color:white}.orange{background:#ed9700;color:white}.gray{background:#66727a;color:white}
.message{font-size:13px;margin-top:10px;min-height:18px;color:var(--green2);font-weight:700}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:190px}
.stagebar{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;margin-bottom:13px}
.stagebar button{min-width:55px;padding:0 11px;background:#edf3f0;color:var(--green)}
.stagebar button.active{background:var(--green);color:white}
.stage-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.stage-title h2{margin:0}.badge{background:var(--light);color:var(--green);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:13px}
table{width:100%;border-collapse:collapse;min-width:650px;background:white}
th{background:var(--green);color:white;text-align:left;padding:10px 9px;font-size:12px}
td{padding:10px 9px;border-top:1px solid #e7eeeb;font-size:13px}
tr:nth-child(even) td{background:#fafcfb}
.empty{text-align:center;padding:24px;color:var(--muted)}
.del{background:#feeceb;color:#b42318;min-height:34px;padding:0 9px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.stat{background:var(--light);border-radius:13px;padding:11px}.stat b{font-size:21px;display:block;color:var(--green)}.stat span{font-size:11px;color:var(--muted)}
footer{text-align:center;color:#83918c;font-size:11px;padding:8px 0 25px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.brand{font-size:22px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.actions button{flex:1;min-width:100px}.stats{grid-template-columns:1fr 1fr}}
@media print{
  header,.formcard,.toolbar,.stagebar,.actions,.del,footer{display:none!important}
  body{background:white}.card{box-shadow:none;border:0;padding:0}
  main{max-width:none;padding:0}.tablewrap{overflow:visible}
  table{min-width:0;font-size:11px}
}
</style>
</head>
<body>
<header>
  <div class="headerline">
    <div class="logo"><div class="sun">☀️</div><div><div class="brand">SOLAR</div><div class="subtitle">Acompanhamento de Leituras</div></div></div>
    <div class="count"><b id="totalTop">0</b>leituras</div>
  </div>
</header>

<main>
  <section class="card formcard">
    <h2>➕ Lançar nova leitura</h2>
    <div class="grid">
      <div><label>C — Código do cliente <span class="req">*</span></label><input id="codigo" inputmode="numeric" placeholder="Digite o C"></div>
      <div><label>Número do medidor <span class="req">*</span></label><input id="medidor" inputmode="numeric" placeholder="Digite o medidor"></div>
      <div><label>Leitura <span class="req">*</span></label><input id="leitura" inputmode="numeric" placeholder="Digite a leitura"></div>
      <div><label>Etapa <span class="req">*</span></label>
        <select id="etapa"><option value="">Selecione</option></select>
      </div>
    </div>
    <div class="actions">
      <button class="primary" onclick="salvarLeitura()">💾 Salvar</button>
      <button class="blue" onclick="exportarCSV()">⬇️ Exportar</button>
      <button class="orange" onclick="window.print()">🖨️ Imprimir</button>
    </div>
    <div id="msg" class="message"></div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>Total de leituras</span></div>
      <div class="stat"><b id="etapasUsadas">0/18</b><span>Etapas com lançamento</span></div>
      <div class="stat"><b id="hoje">0</b><span>Lançadas hoje</span></div>
    </div>
    <div class="toolbar">
      <input id="busca" placeholder="🔎 Pesquisar por C, medidor ou leitura..." oninput="render()">
      <button class="secondary" onclick="limparBusca()">Limpar</button>
    </div>
  </section>

  <section class="card">
    <div class="stagebar" id="stagebar"></div>
    <div class="stage-title"><h2 id="stageHeading">Etapa 1</h2><span class="badge" id="stageCount">0 registros</span></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>C</th><th>Número do medidor</th><th>Leitura</th><th>Data de lançamento</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>
<footer>SOLAR • Acompanhamento de Leituras</footer>

<script>
const KEY='solar_acompanhamento_leituras_v1';
let registros=JSON.parse(localStorage.getItem(KEY)||'[]');
let etapaAtual=1;

const etapaSelect=document.getElementById('etapa');
const stagebar=document.getElementById('stagebar');
for(let i=1;i<=18;i++){
  const o=document.createElement('option'); o.value=i; o.textContent='Etapa '+i; etapaSelect.appendChild(o);
  const b=document.createElement('button'); b.textContent=i; b.onclick=()=>{etapaAtual=i;render()}; b.id='stage-'+i; stagebar.appendChild(b);
}
function agora(){
  const d=new Date();
  return d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
}
function hojeISO(){
  const d=new Date(); return d.toISOString().slice(0,10);
}
function salvarLeitura(){
  const codigo=document.getElementById('codigo').value.trim();
  const medidor=document.getElementById('medidor').value.trim();
  const leitura=document.getElementById('leitura').value.trim();
  const etapa=Number(etapaSelect.value);
  const msg=document.getElementById('msg');
  if(!codigo||!medidor||!leitura||!etapa){msg.textContent='⚠️ Preencha C, medidor, leitura e etapa.';return}
  registros.push({id:Date.now()+Math.random(),codigo,medidor,leitura,etapa,data:agora(),dia:hojeISO()});
  localStorage.setItem(KEY,JSON.stringify(registros));
  document.getElementById('codigo').value='';
  document.getElementById('medidor').value='';
  document.getElementById('leitura').value='';
  etapaSelect.value='';
  msg.textContent='✅ Leitura salva na Etapa '+etapa+'.';
  etapaAtual=etapa; render();
  setTimeout(()=>msg.textContent='',2500);
}
function render(){
  const q=document.getElementById('busca').value.trim().toLowerCase();
  const lista=registros.filter(r=>r.etapa===etapaAtual && (!q || [r.codigo,r.medidor,r.leitura,r.data].some(x=>String(x).toLowerCase().includes(q))));
  document.getElementById('stageHeading').textContent='Etapa '+etapaAtual;
  document.getElementById('stageCount').textContent=lista.length+(lista.length===1?' registro':' registros');
  document.querySelectorAll('.stagebar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('stage-'+etapaAtual).classList.add('active');
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  if(!lista.length){tbody.innerHTML='<tr><td colspan="5" class="empty">Nenhuma leitura lançada nesta etapa.</td></tr>'}
  else lista.slice().reverse().forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${esc(r.codigo)}</b></td><td>${esc(r.medidor)}</td><td><b>${esc(r.leitura)}</b></td><td>${esc(r.data)}</td><td><button class="del" onclick="excluir('${r.id}')">Excluir</button></td>`;
    tbody.appendChild(tr);
  });
  atualizarResumo();
}
function atualizarResumo(){
  document.getElementById('total').textContent=registros.length;
  document.getElementById('totalTop').textContent=registros.length;
  document.getElementById('etapasUsadas').textContent=new Set(registros.map(r=>r.etapa)).size+'/18';
  document.getElementById('hoje').textContent=registros.filter(r=>r.dia===hojeISO()).length;
}
function excluir(id){
  if(!confirm('Excluir esta leitura?')) return;
  registros=registros.filter(r=>String(r.id)!==String(id));
  localStorage.setItem(KEY,JSON.stringify(registros)); render();
}
function limparBusca(){document.getElementById('busca').value='';render()}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function exportarCSV(){
  if(!registros.length){alert('Não há leituras para exportar.');return}
  const linhas=[['C','Número do medidor','Leitura','Etapa','Data de lançamento']];
  registros.forEach(r=>linhas.push([r.codigo,r.medidor,r.leitura,r.etapa,r.data]));
  const csv='\ufeff'+linhas.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='solar_acompanhamento_leituras.csv';a.click();URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
